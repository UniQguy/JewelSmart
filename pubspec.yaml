name: jewelsmart
description: A new Flutter project for premium jewelry.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management & UI
  flutter_riverpod: ^2.4.9
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.0.0

  # Hardware & AR
  camera: ^0.11.0
  permission_handler: ^11.3.1

  # Firebase & Identity
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2  # REQUIRED: Added to fix auth_service.dart errors
  google_sign_in: ^6.2.2

  # Advanced Visuals
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/products/